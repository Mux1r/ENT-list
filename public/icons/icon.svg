  <rect x="128" y="176" width="256" height="3" rx="2" fill="#4B7A5E" opacity="0.12"/>

  <!-- Row 1 — patient silhouette + name bar + status dot -->
  <circle cx="160" cy="220" r="18" fill="#4B7A5E" opacity="0.75"/>
  <path d="M142 238 Q160 230 178 238" stroke="#4B7A5E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
