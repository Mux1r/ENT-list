  <!-- Row 2 -->
  <circle cx="160" cy="288" r="18" fill="#4B7A5E" opacity="0.75"/>
  <path d="M142 306 Q160 298 178 306" stroke="#4B7A5E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  <rect x="194" y="278" width="128" height="11" rx="5.5" fill="#4B7A5E" opacity="0.45"/>
  <rect x="194" y="296" width="80" height="9" rx="4.5" fill="#4B7A5E" opacity="0.22"/>
