<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#4B7A5E"/>

  <!-- Clipboard body -->
  <rect x="104" y="104" width="304" height="360" rx="24" fill="white" opacity="0.96"/>

