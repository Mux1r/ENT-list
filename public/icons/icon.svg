  <!-- Row 3 -->
  <circle cx="160" cy="356" r="18" fill="#4B7A5E" opacity="0.75"/>
  <path d="M142 374 Q160 366 178 374" stroke="#4B7A5E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  <rect x="194" y="346" width="156" height="11" rx="5.5" fill="#4B7A5E" opacity="0.45"/>
  <rect x="194" y="364" width="108" height="9" rx="4.5" fill="#4B7A5E" opacity="0.22"/>
